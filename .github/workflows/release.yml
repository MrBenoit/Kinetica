name: Release
on:
  push:
    tags: ['*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node scripts/validate-release.mjs
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo "Refusing to replace a published release"
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Kinetica $tag beta" --notes-file "docs/release-notes-$tag.md"
          fi
          gh release upload "$tag" dist/main.js dist/manifest.json dist/styles.css --clobber
          gh release edit "$tag" --draft=false --latest
